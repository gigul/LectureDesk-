appId: com.lecturedesk.app
productName: LectureDesk
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
asar: true
asarUnpack:
  # Node OCR/PDF workers need real filesystem module paths, including transitive dependencies.
  - node_modules/**/*
extraResources:
  - from: resources
    to: resources
# Fails the build when the packaged app lacks FFmpeg / @napi-rs/canvas binaries for the target OS and CPU.
afterPack: ./scripts/check-native-binaries.cjs
mac:
  # Supported Mac CPUs: arm64 (Apple Silicon) and x64 (Intel), one DMG + ZIP per CPU.
  # The arch is deliberately NOT listed here: electron-builder adds config archs to CLI archs,
  # so `arch: [arm64, x64]` would make `--mac --x64` build arm64 too, with the wrong native
  # optional dependencies. Choose the CPU on the command line (npm run dist:mac:arm64 / dist:mac:x64);
  # without a CPU flag the arch of the Node.js running the build is used.
  target:
    - dmg
    - zip
  artifactName: LectureDesk-${version}-mac-${arch}.${ext}
  category: public.app-category.education
  minimumSystemVersion: '15.0'
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSMicrophoneUsageDescription: LectureDesk records your microphone only when you start recording or an audio test.
    NSAudioCaptureUsageDescription: LectureDesk captures system audio for the recording source you select.
    NSScreenCaptureUsageDescription: System audio capture uses the desktop capture permission. Screen video is never saved.
    NSCameraUsageDescription: LectureDesk does not use the camera.
win:
  target:
    - target: nsis
      arch: x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  artifactName: LectureDesk-${version}-windows-${arch}-setup.${ext}
publish: null
